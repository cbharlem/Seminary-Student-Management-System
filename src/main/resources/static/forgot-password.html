<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Forgot Password | St. Francis de Sales Seminary</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--gray-50);
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--gray-800);
    display: flex; flex-direction: column;
  }
  .top-bar {
    background: var(--navy); padding: 14px 32px;
    display: flex; align-items: center; gap: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .top-bar-logo {
    width: 40px; height: 40px; border-radius: 50%;
    background: white; display: flex;
    align-items: center; justify-content: center; flex-shrink: 0; padding: 3px;
  }
  .top-bar-logo img { width: 34px; height: 34px; object-fit: contain; }
  .top-bar-title { color: white; font-size: 1rem; font-weight: 700; line-height: 1.2; }
  .top-bar-title span { display: block; font-size: 0.75rem; color: rgba(255,255,255,0.55); font-weight: 400; }
  .top-bar-link {
    margin-left: auto; color: rgba(255,255,255,0.7); font-size: 0.82rem;
    text-decoration: none; padding: 6px 14px;
    border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; transition: all .2s;
  }
  .top-bar-link:hover { color: white; border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.08); }
  .top-bar-link:focus-visible { outline: 2px solid white; outline-offset: 3px; }

  .page-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  .reset-card {
    background: white; border-radius: 12px;
    border: 1px solid var(--gray-200);
    box-shadow: 0 4px 24px rgba(13,27,94,0.08);
    padding: 40px 36px; width: 100%; max-width: 420px;
  }
  .reset-card h1 {
    font-size: 1.4rem; font-weight: 800; color: var(--navy);
    margin: 0 0 8px;
  }
  .reset-card p.sub {
    font-size: 0.875rem; color: var(--gray-600); margin: 0 0 28px; line-height: 1.6;
  }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--gray-600); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 10px 14px;
    border: 1.5px solid var(--gray-200); border-radius: 7px;
    font-size: 0.9rem; font-family: 'Plus Jakarta Sans', sans-serif;
    outline: none; transition: border-color .15s;
  }
  .field input:focus { border-color: var(--accent); }
  .btn-full { width: 100%; padding: 11px; font-size: 0.95rem; font-weight: 700; border-radius: 8px; cursor: pointer; border: none; transition: all .15s; }
  .btn-primary-full { background: var(--accent); color: white; }
  .btn-primary-full:hover { background: #1d3fc7; }
  .btn-primary-full:disabled { opacity: 0.6; cursor: not-allowed; }

  .alert { padding: 12px 16px; border-radius: 8px; font-size: 0.875rem; margin-bottom: 18px; display: none; }
  .alert-success { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
  .alert-error   { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

  .back-link { display: block; text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--accent); text-decoration: none; font-weight: 600; }
  .back-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="top-bar" role="banner">
  <div class="top-bar-logo">
    <img src="images/logo.png" alt="Seminary logo" onerror="this.style.display='none'"/>
  </div>
  <div class="top-bar-title">
    St. Francis de Sales Major Seminary
    <span>Student Management System</span>
  </div>
  <a href="/login.html" class="top-bar-link">Back to Login</a>
</div>

<div class="page-wrap">
  <div class="reset-card" role="main">
    <h1>Forgot Password</h1>
    <p class="sub">Enter your username and the email address linked to your account. We'll send you a password reset link.</p>

    <div class="alert alert-success" id="alert-success" role="alert" aria-live="polite"></div>
    <div class="alert alert-error"   id="alert-error"   role="alert" aria-live="polite"></div>

    <form id="forgot-form" onsubmit="submitForgotPassword(event)" novalidate>
      <div class="field">
        <label for="fp-username">Username <span style="color:var(--danger)">*</span></label>
        <input id="fp-username" type="text" placeholder="e.g. STU-0001" required autocomplete="username" aria-required="true"/>
      </div>
      <div class="field">
        <label for="fp-email">Email Address <span style="color:var(--danger)">*</span></label>
        <input id="fp-email" type="email" placeholder="e.g. juan@email.com" required autocomplete="email" aria-required="true"/>
      </div>
      <button type="submit" class="btn-full btn-primary-full" id="fp-submit">Send Reset Link</button>
    </form>

    <a href="/login.html" class="back-link">← Back to Login</a>
  </div>
</div>

<script>
async function submitForgotPassword(e) {
  e.preventDefault();
  const username = document.getElementById('fp-username').value.trim();
  const email    = document.getElementById('fp-email').value.trim();
  const btn      = document.getElementById('fp-submit');
  const success  = document.getElementById('alert-success');
  const error    = document.getElementById('alert-error');
  success.style.display = 'none';
  error.style.display   = 'none';

  if (!username) { showError('Please enter your username.'); return; }
  if (!email)    { showError('Please enter your email address.'); return; }

  btn.disabled = true;
  btn.textContent = 'Sending…';
  try {
    const res  = await fetch('/api/public/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email })
    });
    const data = await res.json();
    if (!res.ok) { showError(data.error || 'Something went wrong.'); return; }
    success.textContent = 'If that email is registered, a reset link has been sent. Check your inbox.';
    success.style.display = 'block';
    document.getElementById('forgot-form').style.display = 'none';
  } catch (_) {
    showError('Unable to reach the server. Please try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send Reset Link';
  }
}
function showError(msg) {
  const el = document.getElementById('alert-error');
  el.textContent = msg;
  el.style.display = 'block';
}
</script>
</body>
</html>
